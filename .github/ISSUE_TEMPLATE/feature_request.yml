name: Feature request
description: Suggest a new sink rule, guard pattern, agent framework, or other enhancement
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before you start, please search existing
        issues to avoid duplicates.

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      options:
        - New sink rule (new consequential action to detect)
        - New guard pattern (new authority-check function to recognise)
        - New agent framework (new tool decorator / base class to recognise)
        - New output format (HTML, Markdown, JSON-lines, etc.)
        - New CLI flag / subcommand
        - Performance improvement
        - Documentation improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like actenon-scan to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other ways could this be solved? Why did you reject them?

  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        For new sink rules: a code snippet that SHOULD fire the rule but
        currently doesn't. For new guard patterns: a code snippet using
        your guard convention that should be recognised. For new agent
        frameworks: a code snippet using your framework's tool decorator.
      render: python

  - type: checkboxes
    id: terms
    attributes:
      label: Code of conduct
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I have read CONTRIBUTING.md and the "How to add" sections.
          required: true
