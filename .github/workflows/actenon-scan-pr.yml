# Actenon Scan — PR sticky-comment workflow
#
# Work Order 2, Part 5.2: scans changed files on PRs and posts ONE
# sticky comment that is updated in place. Does not fail the build by
# default. Clearly distinguishes candidates from confirmed
# vulnerabilities.
#
# Features:
#   - scans only changed files (--changed-only)
#   - posts one sticky comment (located by a hidden HTML marker)
#   - updates the comment in place on subsequent runs
#   - no duplicate comments
#   - does not fail the build by default (--fail-on none)
#   - includes the blast-radius summary
#   - links to detailed artifacts
#   - respects fork-PR permissions (no secrets exposed)
#
# To enable: copy this file to .github/workflows/ in your repository.

name: actenon-scan

on:
  pull_request:
    paths:
      - '**/*.py'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.go'

permissions:
  pull-requests: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # Respect fork-PR permissions: only post a comment when the PR is
    # from the same repo (not a fork). Fork PRs get the scan result in
    # the Actions log but no comment (the GITHUB_TOKEN can't write to
    # the fork's parent PR comment area without explicit permissions).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install actenon-scan
        run: |
          python -m pip install --upgrade pip
          # Install from the repo source so the workflow uses the current
          # version (including --no-cache, blast-radius summary, etc.).
          # External repositories should replace this with:
          #   pip install "actenon-scan[typescript,go,yaml]"
          pip install -e ".[typescript,go,yaml]"

      - name: Scan changed files
        id: scan
        run: |
          # Get the list of changed files and scan only those.
          CHANGED=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD -- '*.py' '*.ts' '*.tsx' '*.js' '*.jsx' '*.go' | head -200)
          if [ -z "$CHANGED" ]; then
            echo "No scannable files changed."
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Write the file list to a temp file and scan each.
          echo "$CHANGED" > /tmp/changed-files.txt
          actenon-scan scan . --changed-only origin/${{ github.base_ref }} \
            --format markdown --fail-on none --output /tmp/scan-report.md \
            --no-cache 2>&1 || true

          # Check if the report has findings.
          if grep -q "findings in\|consequential actions" /tmp/scan-report.md; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build comment body
        if: steps.scan.outputs.has_findings == 'true'
        id: body
        run: |
          {
            echo "<!-- actenon-scan-sticky-comment -->"
            echo ""
            echo "## Actenon Scan"
            echo ""
            echo "> These are scanner **candidates**, not confirmed vulnerabilities. Each must be manually reviewed for reachability, caller control, and guard dominance."
            echo ""
            cat /tmp/scan-report.md
            echo ""
            echo "---"
            echo "_This comment is updated automatically by the \`actenon-scan\` workflow. Use \`actenon-scan explain <file:line>\` locally for the full execution path._"
          } > /tmp/comment-body.md

      - name: Find existing sticky comment
        if: steps.scan.outputs.has_findings == 'true'
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use the GitHub API to find an existing comment with our marker.
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("actenon-scan-sticky-comment")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            echo "comment_id=$COMMENT_ID" >> "$GITHUB_OUTPUT"
            echo "Found existing comment: $COMMENT_ID"
          else
            echo "No existing comment found — will create a new one."
          fi

      - name: Update or create sticky comment
        if: steps.scan.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_ID="${{ steps.find.outputs.comment_id }}"
          if [ -n "$COMMENT_ID" ]; then
            # Update the existing comment in place.
            gh api repos/${{ github.repository }}/issues/comments/$COMMENT_ID \
              --method PATCH \
              --field body=@/tmp/comment-body.md
            echo "Updated comment $COMMENT_ID"
          else
            # Create a new comment.
            gh pr comment ${{ github.event.pull_request.number }} \
              --body-file /tmp/comment-body.md
            echo "Created new comment"
          fi

      - name: No findings — remove stale comment if present
        if: steps.scan.outputs.has_findings == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If there are no findings but a stale comment exists, hide it.
          COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            --jq '.[] | select(.body | contains("actenon-scan-sticky-comment")) | .id' | head -1)
          if [ -n "$COMMENT_ID" ]; then
            # Minimize (hide) the stale comment rather than deleting it,
            # so the history is preserved.
            gh api graphql -f query='
              mutation {
                minimizeComment(input: {subjectId: "'"$COMMENT_ID"'", classifier: OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }' || true
            echo "Hid stale comment $COMMENT_ID"
          fi
