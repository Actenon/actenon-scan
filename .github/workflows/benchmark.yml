name: Benchmark

# Ratcheting benchmark: precision must be 100%, recall and soundness
# must not decrease from the committed baseline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    name: Recall / Precision / Soundness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify COVERAGE.md contract
        # Every row marked COVERED must be backed by a hand-triaged corpus
        # true positive. A capability claim in the docs cannot outrun the
        # evidence for it.
        run: python scripts/check_coverage_contract.py

      - name: Verify corpus triage (re-measures pinned repos)
        # Task 3: the gate now RE-MEASURES by default — clones each
        # pinned repo at its SHA, scans it, and compares to triage.
        # If network fetching fails, the gate fails loudly (exit 2).
        # Pass --no-remeasure ONLY for local dev (NOT for CI).
        # 30-minute timeout: cloning 25 repos + scanning takes time.
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_corpus_triage.py

      - name: Run benchmark
        run: python scripts/benchmark.py --check
