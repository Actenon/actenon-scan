name: Benchmark

# Ratcheting benchmark: precision must be 100%, recall and soundness
# must not decrease from the committed baseline.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmark:
    name: Recall / Precision / Soundness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install with dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify COVERAGE.md contract
        # Every row marked COVERED must be backed by a hand-triaged corpus
        # true positive. A capability claim in the docs cannot outrun the
        # evidence for it.
        run: python scripts/check_coverage_contract.py

      - name: Verify corpus triage (re-measures pinned repos)
        # The gate RE-MEASURES: clones each pinned repo at its SHA,
        # scans it, and compares to triage. Uses --no-remeasure when
        # the committed data is fresh (measured at the current commit
        # SHA and version matches). Falls back to --no-remeasure for
        # docs-only PRs that don't change detection code.
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if corpus data is fresh (version matches + recent measurement)
          CURRENT_SHA=$(git rev-parse HEAD)
          RECORDED_SHA=$(python -c "import json; d=json.load(open('tests/benchmark/corpus-results.json')); print(d.get('measured_at_sha',''))" 2>/dev/null || echo "")
          RECORDED_VER=$(python -c "import json; d=json.load(open('tests/benchmark/corpus-triage.json')); print(d.get('scanner_version_measured_with',''))" 2>/dev/null || echo "")
          CURRENT_VER=$(python -c "from actenon_scan import __version__; print(__version__)")
          if [ "$RECORDED_SHA" = "$CURRENT_SHA" ] && [ "$RECORDED_VER" = "$CURRENT_VER" ]; then
            echo "Corpus data is fresh (SHA=$CURRENT_SHA, version=$CURRENT_VER). Using --no-remeasure."
            python scripts/check_corpus_triage.py --no-remeasure
          else
            echo "Corpus data is stale (recorded SHA=$RECORDED_SHA, current=$CURRENT_SHA). Re-measuring..."
            python scripts/check_corpus_triage.py
          fi

      - name: Run benchmark
        run: python scripts/benchmark.py --check
