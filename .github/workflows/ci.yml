name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check generated Python badge
        if: matrix.python-version == '3.12'
        run: python scripts/sync_badges.py --check
      - name: Check README registry installs
        if: matrix.python-version == '3.12'
        run: python scripts/check_readme_installs.py
      - name: Check README ecosystem table in sync with ecosystem.yaml
        if: matrix.python-version == '3.12'
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-scan

      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v

  # Part 6.4: CI matrix must run the test suite BOTH with and without
  # the [typescript] extra. The base-install job is what protects RULE 4
  # (the zero-runtime-dependency guarantee).
  base-install-test:
    name: Base install (no extras) — zero-dep guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install with NO extras
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install --upgrade pip
          /tmp/base/bin/pip install pytest
          /tmp/base/bin/pip install -e .
      - name: Verify NO third-party runtime deps
        run: |
          # The base install must have zero third-party runtime deps.
          # actenon-scan and its only transitive deps should be stdlib-only.
          if /tmp/base/bin/pip list | grep -iE "tree.sitter|pyyaml|cryptography"; then
            echo "FAIL: base install has third-party runtime deps"
            /tmp/base/bin/pip list
            exit 1
          fi
          echo "OK: zero third-party runtime deps"
      - name: Verify import works without extra
        run: /tmp/base/bin/python -c "import actenon_scan; print('OK')"
      - name: Run tests (skipping TS-specific and dev-dep tests)
        run: /tmp/base/bin/python -m pytest tests/ -v --ignore=tests/test_protocol_drift.py


  # The verify-claims job moved to verify-claims.yml so the README
  # badge can link to a dedicated gate.

  # The test jobs install editable, which puts the source tree on sys.path
  # and hides packaging mistakes: a subpackage missing from pyproject's
  # package list still imports. This job installs the BUILT wheel into a
  # clean venv and runs a real directory scan, which imports every layer
  # (a wheel without actenon_scan.repository crashed here).
  wheel-smoke:
    name: Built wheel installs and scans a directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
      - name: Install wheel into a clean venv (outside the checkout)
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/actenon_scan-*.whl
      - name: Scan a directory with the installed wheel
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/actenon-scan scan "$GITHUB_WORKSPACE/tests/benchmark/recall" \
            --format json --output /tmp/wheel-scan.json --fail-on none --no-cache
          /tmp/wheel-venv/bin/python -c "import json; d=json.load(open('/tmp/wheel-scan.json')); assert d['repository_analysis_enabled'] and d['finding_count'] > 0, d; print('OK', d['finding_count'], 'findings')"
