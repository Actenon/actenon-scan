name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check generated Python badge
        if: matrix.python-version == '3.12'
        run: python scripts/sync_badges.py --check
      - name: Check README registry installs
        if: matrix.python-version == '3.12'
        run: python scripts/check_readme_installs.py
      - name: Check README ecosystem table in sync with ecosystem.yaml
        if: matrix.python-version == '3.12'
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-scan

      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v

  # Part 6.4: CI matrix must run the test suite BOTH with and without
  # the [typescript] extra. The base-install job is what protects RULE 4
  # (the zero-runtime-dependency guarantee).
  base-install-test:
    name: Base install (no extras) — zero-dep guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install with NO extras
        run: |
          python -m venv /tmp/base
          /tmp/base/bin/pip install --upgrade pip
          /tmp/base/bin/pip install pytest
          /tmp/base/bin/pip install -e .
      - name: Verify NO third-party runtime deps
        run: |
          # The base install must have zero third-party runtime deps.
          # actenon-scan and its only transitive deps should be stdlib-only.
          if /tmp/base/bin/pip list | grep -iE "tree.sitter|pyyaml|cryptography"; then
            echo "FAIL: base install has third-party runtime deps"
            /tmp/base/bin/pip list
            exit 1
          fi
          echo "OK: zero third-party runtime deps"
      - name: Verify import works without extra
        run: /tmp/base/bin/python -c "import actenon_scan; print('OK')"
      - name: Run tests (skipping TS-specific and dev-dep tests)
        run: /tmp/base/bin/python -m pytest tests/ -v --ignore=tests/test_protocol_drift.py


  # The verify-claims job moved to verify-claims.yml so the README
  # badge can link to a dedicated gate.
