name: Publish to PyPI

# The only route from source to PyPI for actenon-scan. Every job is reachable
# only through the release gate, and scripts/release_gate.py validate (CI job
# "Required-check names exist") fails if this file is loosened.
#
#   release-gate     the run is a push of tag v<pyproject version>, on a commit
#                    that is on main, carries no candidate source pin, and whose
#                    required checks (.github/required-checks.json "release") all
#                    succeeded; main protection, the release-tag rulesets and the
#                    reviewed pypi environment must be in force.
#   build            builds once, reproducibly, smoke-tests the built wheel, and
#                    records the approved artifacts' SHA-256 (SHA256SUMS).
#   publish          waits for an owner to approve the pypi environment, checks
#                    the artifacts against the approved record, and uploads them
#                    by trusted publishing (OIDC, with PEP 740 attestations).
#                    There is no API-token route.
#   verify-registry  PyPI serves exactly the approved files with this workflow's
#                    attestations; a clean hash-pinned install is the approved
#                    wheel byte for byte and runs a real scan; pyproject, tag and
#                    PyPI agree.
#
# There is deliberately no workflow_dispatch: a manual run cannot publish an
# untagged or unapproved commit. To retry a failed release, re-run this
# workflow's failed jobs on the same tag. See docs/RELEASE_CHECKLIST.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.3
      - name: Tag, main ancestry, required checks and release controls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/release_gate.py gate --tag-prefix v --version-from pyproject.toml

  build:
    name: Build and record the approved artifacts
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: version
        run: echo "version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel (reproducible from the commit time)
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --sdist --wheel --outdir dist/
          python -m twine check --strict dist/*
      - name: Built wheel installs into a clean venv and scans a directory
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv smoke
          smoke/bin/pip install "$GITHUB_WORKSPACE"/dist/actenon_scan-*.whl
          smoke/bin/actenon-scan --version
          smoke/bin/actenon-scan scan "$GITHUB_WORKSPACE/tests/benchmark/recall" \
            --format json --output smoke.json --fail-on none --no-cache
          smoke/bin/python -c "import json; d=json.load(open('smoke.json')); assert d['repository_analysis_enabled'] and d['finding_count'] > 0, d; print('OK', d['finding_count'], 'findings')"
      - name: Record the approved artifacts
        run: python scripts/release_gate.py dist --dist dist --version "${{ steps.version.outputs.version }}" --write-sums SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist/
            SHA256SUMS

  publish:
    name: Publish to PyPI (trusted publishing, owner-approved)
    needs: [release-gate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-gate.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/actenon-scan/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release/
      - name: Upload exactly the approved artifacts (SHA256SUMS)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - <<'EOF'
          import hashlib, os, re, sys
          from pathlib import Path
          v = os.environ["VERSION"]
          expected = {f"actenon_scan-{v}-py3-none-any.whl", f"actenon_scan-{v}.tar.gz"}
          dist = Path("release/dist")
          present = {p.name for p in dist.iterdir()} if dist.is_dir() else set()
          if not re.fullmatch(r"\d+\.\d+\.\d+", v) or present != expected:
              sys.exit(f"::error::release/dist holds {sorted(present)}; approved {sorted(expected)}")
          sums = Path("release/SHA256SUMS")
          lines = sums.read_text().splitlines() if sums.is_file() else []
          approved = dict(reversed(line.split("  ", 1)) for line in lines if "  " in line)
          actual = {n: hashlib.sha256((dist / n).read_bytes()).hexdigest() for n in expected}
          if len(lines) != 2 or approved != actual:
              sys.exit(f"::error::artifacts differ from the approved SHA256SUMS: {approved} != {actual}")
          print("approved artifacts:", actual)
          EOF
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist/
          attestations: true
          print-hash: true

  verify-registry:
    name: Clean PyPI install is the approved wheel and scans
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release/
      - name: PyPI serves exactly the approved, attested artifacts
        run: python scripts/release_gate.py verify-pypi --version "$VERSION" --sums release/SHA256SUMS --wait 900
      - name: Hash-pinned install from PyPI into a clean venv
        run: |
          awk -v v="$VERSION" 'BEGIN{printf "actenon-scan==%s", v} {printf " --hash=sha256:%s", $1} END{print ""}' \
            release/SHA256SUMS > "$RUNNER_TEMP/requirements.txt"
          cat "$RUNNER_TEMP/requirements.txt"
          python -m venv "$RUNNER_TEMP/v"
          "$RUNNER_TEMP/v/bin/pip" install --isolated --no-cache-dir --require-hashes --only-binary=:all: \
            --index-url https://pypi.org/simple --report "$RUNNER_TEMP/install-report.json" \
            -r "$RUNNER_TEMP/requirements.txt"
      - name: Installed package is the approved wheel, byte for byte
        run: |
          python scripts/release_gate.py verify-installed --version "$VERSION" --sums release/SHA256SUMS \
            --dist release/dist --python "$RUNNER_TEMP/v/bin/python" --report "$RUNNER_TEMP/install-report.json" \
            --workdir "$RUNNER_TEMP"
      - name: Installed actenon-scan scan runs on a known-positive directory
        working-directory: ${{ runner.temp }}
        run: |
          test "$(v/bin/actenon-scan --version)" = "actenon-scan $VERSION" || { v/bin/actenon-scan --version; exit 1; }
          v/bin/actenon-scan scan "$GITHUB_WORKSPACE/tests/benchmark/recall" \
            --format json --output scan.json --fail-on none --no-cache
          v/bin/actenon-scan scan "$GITHUB_WORKSPACE/tests/benchmark/recall" \
            --format sarif --output scan.sarif --fail-on none --no-cache
          v/bin/python -I -c "import json,os; d=json.load(open('scan.json')); s=json.load(open('scan.sarif')); assert d['repository_analysis_enabled'] and d['finding_count'] > 0 and d['version'] == os.environ['VERSION'], d; assert s['runs'] and s['runs'][0]['tool']['driver']['version'] == os.environ['VERSION'], s['runs'][0]['tool']; print('OK', d['finding_count'], 'findings')"
      - name: pyproject, tag and PyPI agree (no waiver)
        run: |
          python -m pip install packaging==26.3
          python scripts/check_version_coherence.py --mode release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-verification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/requirements.txt
            ${{ runner.temp }}/install-report.json
            ${{ runner.temp }}/scan.json
            ${{ runner.temp }}/scan.sarif
