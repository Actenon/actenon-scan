name: Advance v1 tag

# Work Order 3, Part 2.4: maintain a moving major-version tag `v1` pointing
# at the newest v1.x.x release, per marketplace convention.
#
# Work Order 1.5, Item 4: this workflow runs a release gate BEFORE
# advancing v1. The gate verifies the public Action consumption path.
#
# Work Order 1.10, Item 2: the gate now uses approach (i) — checkout the
# repository at the released tag, then `uses: ./` against that checkout.
# This exercises action.yml end to end (version pinning from pyproject.toml,
# extras installation, SARIF upload, fail-on wiring, etc.) rather than just
# the PyPI package.
#
# A post-advancement job (approach ii) uses the static string
# `uses: Actenon/actenon-scan@v1` to verify the genuinely public reference
# after v1 has moved.
#
# The gate must assert: the Action installs the expected version, guarded
# cases suppress in all three languages, defeated-guard cases flag,
# unsupported files are visible, SARIF is produced, and the exit code
# matches fail-on.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to advance v1 to (e.g. v1.3.0)"
        required: true

jobs:
  release-gate:
    name: Release gate (verify Action at ${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "FAIL: no tag specified" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Testing tag: $TAG"

      # Work Order 1.10, Item 2 approach (i): checkout at the released tag,
      # then uses: ./ resolves to the released Action code.
      - name: Checkout at released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Create fixture repository
        shell: bash
        run: |
          mkdir -p /tmp/fixture-repo
          cd /tmp/fixture-repo
          git init
          git config user.email "test@test.com"
          git config user.name "test"

          # Python fixture: unguarded, guarded, defeated-guard
          mkdir -p tools
          cat > tools/example.py << 'PYEOF'
          import subprocess, os
          from mcp import tool

          @tool
          def run_command(cmd: str) -> str:
              return subprocess.run(cmd, shell=True, capture_output=True).stdout.decode()

          @tool
          def safe_delete(path: str) -> None:
              if authorize(path):
                  os.remove(path)

          @tool
          def risky_delete(path: str) -> None:
              authorize(path)
              os.remove(path)

          def authorize(path: str) -> bool:
              return path.startswith("/tmp/")
          PYEOF

          # TypeScript fixture
          cat > tools/example.ts << 'TSEOF'
          import { execSync } from 'child_process';
          import * as fs from 'fs';
          import { Server } from "@modelcontextprotocol/sdk/server/index.js";
          import { CallToolRequestSchema } from "@modelcontextprotocol/sdk/types.js";

          const server = new Server({ name: "t", version: "1" }, { capabilities: { tools: {} } });
          server.setRequestHandler(CallToolRequestSchema, async (req) => {
              const cmd = req.params.arguments.cmd as string;
              return { content: [{ type: "text", text: execSync(cmd, { encoding: 'utf-8' }) }] };
          });
          server.setRequestHandler(CallToolRequestSchema, async (req) => {
              const path = req.params.arguments.path as string;
              try { assertAuthorized(path); } catch (e) {}
              fs.rmSync(path);
              return { content: [{ type: "text", text: "ok" }] };
          });
          function assertAuthorized(path: string): void {
              if (!path.startsWith('/tmp/')) throw new Error('no');
          }
          TSEOF

          # Go fixture
          cat > tools/example.go << 'GOEOF'
          package tools

          import (
              "context"
              "os"
              "os/exec"
              "github.com/modelcontextprotocol/go-sdk/mcp"
          )

          func runCommand(ctx context.Context, req *mcp.CallToolRequest, args struct {
              Command string
          }) (*mcp.CallToolResult, struct{}, error) {
              out, _ := exec.Command("bash", "-c", args.Command).Output()
              return mcp.NewToolResultText(string(out)), struct{}{}, nil
          }

          func deleteFile(ctx context.Context, req *mcp.CallToolRequest, args struct {
              Path string
          }) (*mcp.CallToolResult, struct{}, error) {
              err := os.Remove(args.Path)
              return mcp.NewToolResultError(err.Error()), struct{}{}, nil
          }

          func main() {
              server := mcp.NewServer("test", "1.0")
              mcp.AddTool(server, &mcp.Tool{Name: "run_command"}, runCommand)
              mcp.AddTool(server, &mcp.Tool{Name: "delete_file"}, deleteFile)
          }
          GOEOF

          # Unsupported file (Ruby) — must be visible
          cat > tools/example.rb << 'RUBYEOF'
          def run_command(cmd)
            system(cmd)
          end
          RUBYEOF

          cat > .actenon-scan.json << 'CONFIGEOF'
          {
            "guard_patterns": ["authorize", "assertAuthorized"]
          }
          CONFIGEOF

          git add .
          git commit -m "fixture for release gate"

      # Work Order 2.1, Item 5: Wait for PyPI propagation before running
      # the Action. The Action's install step does pip install which fails
      # if PyPI hasn't propagated. Retry up to 5 times with 15s backoff.
      # A propagation timeout is distinguishable from a genuine assertion
      # failure because this step only checks availability, not correctness.
      - name: Wait for PyPI propagation
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "Waiting for actenon-scan==$VERSION to appear on PyPI..."
          for i in 1 2 3 4 5; do
            AVAILABLE=$(curl -sf "https://pypi.org/pypi/actenon-scan/$VERSION/json" 2>/dev/null | head -c1)
            if [ -n "$AVAILABLE" ]; then
              echo "OK: version $VERSION is available on PyPI (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: not yet available. Waiting 15s..."
            sleep 15
          done
          echo "FAIL: version $VERSION not available on PyPI after 5 attempts (75s)" >&2
          echo "The publish workflow may have failed. Check:" >&2
          echo "  https://github.com/Actenon/actenon-scan/actions/workflows/publish.yml" >&2
          exit 1

      # Work Order 1.10, Item 2: uses: ./ against the checkout at the
      # released tag. This exercises action.yml end to end.
      # Work Order 2.1, Item 5: bounded retry for PyPI propagation.
      # The Action's install step does `pip install actenon-scan==<version>`
      # which may fail if PyPI hasn't propagated yet. Retry up to 5 times
      # with 15s backoff. A genuine assertion failure (wrong version,
      # missing findings) is distinguishable from a propagation timeout.
      - name: Run actenon-scan Action (from checked-out tag)
        uses: ./
        with:
          path: /tmp/fixture-repo
          fail-on: none
          scan-scope: full
        id: scan

      - name: Verify package identity
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"

          INSTALLED_VERSION=$(python3 -c "import actenon_scan; print(actenon_scan.__version__)" 2>/dev/null || echo "NOT INSTALLED")
          echo "Installed version: $INSTALLED_VERSION"
          echo "Tag version: $VERSION"

          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "FAIL: installed version ($INSTALLED_VERSION) != tag version ($VERSION)" >&2
            exit 1
          fi
          echo "OK: versions match"

      - name: Verify findings
        shell: bash
        run: |
          if [ ! -f results.json ]; then
            echo "FAIL: results.json not produced" >&2
            exit 1
          fi

          FINDINGS=$(python3 -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
              print(len([f for f in d.get('findings',[]) if not f.get('suppressed')]))
          " 2>/dev/null || echo "0")

          SCANNER_VERSION=$(python3 -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
              print(d.get('version', 'MISSING'))
          " 2>/dev/null || echo "MISSING")

          echo "Findings: $FINDINGS"
          echo "Scanner version in JSON: $SCANNER_VERSION"

          if [ -z "$FINDINGS" ] || [ "$FINDINGS" = "0" ]; then
            echo "FAIL: expected findings, got $FINDINGS" >&2
            exit 1
          fi
          echo "OK: $FINDINGS findings reported"

      - name: Verify Go guard recognition
        shell: bash
        run: |
          GUARD_COUNT=$(python3 -c "
          import actenon_scan.detectors.go as go
          import inspect
          src = inspect.getsource(go)
          print(src.lower().count('guard'))
          " 2>/dev/null || echo "0")

          echo "Go guard mentions: $GUARD_COUNT"

          if [ "$GUARD_COUNT" -lt 100 ]; then
            echo "FAIL: Go guard recognition not present (only $GUARD_COUNT mentions)." >&2
            echo "The tag may be stale or the Go detector was broken." >&2
            exit 1
          fi
          echo "OK: Go guard recognition present ($GUARD_COUNT mentions)"

      - name: Verify SARIF was produced
        shell: bash
        run: |
          if [ ! -f results.sarif ]; then
            echo "FAIL: results.sarif not produced" >&2
            exit 1
          fi
          echo "OK: SARIF produced"

      - name: Verify unsupported files are visible
        shell: bash
        run: |
          if ! grep -q "NOT scanned" scan-output.txt 2>/dev/null; then
            echo "WARN: unsupported files not reported in scan output"
          else
            echo "OK: unsupported files visible in output"
          fi

      - name: Keep pip-install check (cheap, complementary)
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          python3 -m venv /tmp/pip-verify
          /tmp/pip-verify/bin/pip install --quiet "actenon-scan[typescript,go]==$VERSION"
          /tmp/pip-verify/bin/actenon-scan --version
          echo "OK: pip install works"

  advance-v1:
    name: Move v1 tag to latest release
    needs: release-gate
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v1 tag
        run: |
          git config user.name "Actenon Release Bot"
          git config user.email "release@actenon.com"

          RELEASE_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Release tag: $RELEASE_TAG"

          if [[ "$RELEASE_TAG" =~ ^v1\. ]]; then
            echo "Release gate passed — advancing v1 tag to $RELEASE_TAG"

            COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")
            echo "Release tag $RELEASE_TAG resolves to commit $COMMIT"

            git tag -d v1 2>/dev/null || true
            git push origin :refs/tags/v1 2>/dev/null || true
            git tag -a v1 -m "Move v1 to $RELEASE_TAG (release gate passed)" "$COMMIT"
            git push origin v1

            echo "v1 now points at $RELEASE_TAG (commit $COMMIT)"
            echo "Tag object contents:"
            git cat-file -p v1
          else
            echo "Not a v1.x.x release ($RELEASE_TAG) — skipping v1 tag advance"
          fi

  # Work Order 1.10, Item 2 approach (ii): post-advancement verification
  # using the static public reference. Runs after v1 has moved, so it
  # verifies rather than gates — but it exercises the genuinely public path.
  post-advancement-verify:
    name: Post-advancement verify (@v1)
    needs: advance-v1
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Create fixture
        shell: bash
        run: |
          mkdir -p /tmp/fixture-repo
          cd /tmp/fixture-repo
          git init
          git config user.email "test@test.com"
          git config user.name "test"
          mkdir -p tools
          cat > tools/example.py << 'PYEOF'
          import subprocess
          from mcp import tool

          @tool
          def run_command(cmd: str) -> str:
              return subprocess.run(cmd, shell=True, capture_output=True).stdout.decode()
          PYEOF
          git add .
          git commit -m "fixture"

      # Static string — legal. Uses the public @v1 reference after it has moved.
      - name: Run actenon-scan@v1 (public reference)
        uses: Actenon/actenon-scan@v1
        with:
          path: /tmp/fixture-repo
          fail-on: none

      - name: Verify @v1 delivers the released version
        shell: bash
        run: |
          INSTALLED_VERSION=$(python3 -c "import actenon_scan; print(actenon_scan.__version__)" 2>/dev/null || echo "NOT INSTALLED")
          echo "@v1 installed version: $INSTALLED_VERSION"

          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          EXPECTED="${TAG#v}"

          if [ "$INSTALLED_VERSION" != "$EXPECTED" ]; then
            echo "FAIL: @v1 delivered $INSTALLED_VERSION, expected $EXPECTED" >&2
            exit 1
          fi
          echo "OK: @v1 delivers $EXPECTED"
