name: Advance v1 tag

# Work Order 3, Part 2.4: maintain a moving major-version tag `v1` pointing
# at the newest v1.x.x release, per marketplace convention.
#
# Work Order 1.5, Item 4: this workflow now runs a release gate BEFORE
# advancing v1. The gate consumes `uses: Actenon/actenon-scan@<tag>` against
# a fixture. v1 does not advance until the gate passes.
#
# Work Order 1.9: the gate was originally a reusable workflow call, but
# GitHub Actions does not allow dynamic `uses:` references (the action
# reference is resolved before any steps or jobs run). The gate is now
# inlined as a separate job that uses the release event's tag_name directly.
#
# Work Order 1.5, Item 4 (cosmetic): the tag object's `tag` field reads
# `v1` (via `git tag -a v1 -m "..." <commit>`), not the release tag name.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to advance v1 to (e.g. v1.3.0)"
        required: true

jobs:
  release-gate:
    name: Release gate (verify @${{ github.event.release.tag_name || inputs.tag }})
    runs-on: ubuntu-latest
    steps:
      - name: Create fixture repository
        shell: bash
        run: |
          mkdir -p /tmp/fixture-repo
          cd /tmp/fixture-repo
          git init
          git config user.email "test@test.com"
          git config user.name "test"

          # Python fixture: one unguarded, one guarded, one defeated guard
          mkdir -p tools
          cat > tools/example.py << 'PYEOF'
          import subprocess, os
          from mcp import tool

          @tool
          def run_command(cmd: str) -> str:
              return subprocess.run(cmd, shell=True, capture_output=True).stdout.decode()

          @tool
          def safe_delete(path: str) -> None:
              if authorize(path):
                  os.remove(path)

          @tool
          def risky_delete(path: str) -> None:
              authorize(path)
              os.remove(path)

          def authorize(path: str) -> bool:
              return path.startswith("/tmp/")
          PYEOF

          # TypeScript fixture
          cat > tools/example.ts << 'TSEOF'
          import { execSync } from 'child_process';
          import * as fs from 'fs';
          import { Server } from "@modelcontextprotocol/sdk/server/index.js";
          import { CallToolRequestSchema } from "@modelcontextprotocol/sdk/types.js";

          const server = new Server({ name: "t", version: "1" }, { capabilities: { tools: {} } });
          server.setRequestHandler(CallToolRequestSchema, async (req) => {
              const cmd = req.params.arguments.cmd as string;
              return { content: [{ type: "text", text: execSync(cmd, { encoding: 'utf-8' }) }] };
          });
          server.setRequestHandler(CallToolRequestSchema, async (req) => {
              const path = req.params.arguments.path as string;
              try { assertAuthorized(path); } catch (e) {}
              fs.rmSync(path);
              return { content: [{ type: "text", text: "ok" }] };
          });
          function assertAuthorized(path: string): void {
              if (!path.startsWith('/tmp/')) throw new Error('no');
          }
          TSEOF

          # Go fixture
          cat > tools/example.go << 'GOEOF'
          package tools

          import (
              "context"
              "os"
              "os/exec"
              "github.com/modelcontextprotocol/go-sdk/mcp"
          )

          func runCommand(ctx context.Context, req *mcp.CallToolRequest, args struct {
              Command string
          }) (*mcp.CallToolResult, struct{}, error) {
              out, _ := exec.Command("bash", "-c", args.Command).Output()
              return mcp.NewToolResultText(string(out)), struct{}{}, nil
          }

          func deleteFile(ctx context.Context, req *mcp.CallToolRequest, args struct {
              Path string
          }) (*mcp.CallToolResult, struct{}, error) {
              err := os.Remove(args.Path)
              return mcp.NewToolResultError(err.Error()), struct{}{}, nil
          }

          func main() {
              server := mcp.NewServer("test", "1.0")
              mcp.AddTool(server, &mcp.Tool{Name: "run_command"}, runCommand)
              mcp.AddTool(server, &mcp.Tool{Name: "delete_file"}, deleteFile)
          }
          GOEOF

          cat > .actenon-scan.json << 'CONFIGEOF'
          {
            "guard_patterns": ["authorize", "assertAuthorized"]
          }
          CONFIGEOF

          git add .
          git commit -m "fixture for release gate"

      - name: Verify the published artifact from PyPI
        shell: bash
        run: |
          # Work Order 1.9: GitHub Actions does not allow dynamic uses:
          # references (the action reference must be a static string).
          # Instead of `uses: Actenon/actenon-scan@<tag>`, we install
          # the exact PyPI version and run the CLI directly. This tests
          # the same public artifact (the PyPI package) that the Action
          # installs.
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"

          echo "Installing actenon-scan[typescript,go]==$VERSION from PyPI..."
          pip install "actenon-scan[typescript,go]==$VERSION"

          INSTALLED_VERSION=$(python3 -c "import actenon_scan; print(actenon_scan.__version__)" 2>/dev/null || echo "NOT INSTALLED")
          echo "Installed version: $INSTALLED_VERSION"

          if [ "$INSTALLED_VERSION" != "$VERSION" ]; then
            echo "FAIL: installed version ($INSTALLED_VERSION) != tag version ($VERSION)" >&2
            exit 1
          fi
          echo "OK: versions match"

          # Scan the fixture
          cd /tmp/fixture-repo
          actenon-scan scan . --format json --output results.json --fail-on none

          # Verify findings
          FINDINGS=$(python3 -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
              print(len([f for f in d.get('findings',[]) if not f.get('suppressed')]))
          " 2>/dev/null || echo "0")

          SCANNER_VERSION=$(python3 -c "
          import json
          with open('results.json') as f:
              d = json.load(f)
              print(d.get('version', 'MISSING'))
          " 2>/dev/null || echo "MISSING")

          echo "Findings: $FINDINGS"
          echo "Scanner version in JSON: $SCANNER_VERSION"

          if [ -z "$FINDINGS" ] || [ "$FINDINGS" = "0" ]; then
            echo "FAIL: expected at least 3 findings, got $FINDINGS" >&2
            exit 1
          fi
          echo "OK: $FINDINGS findings reported"

          # Verify Go guard recognition
          GUARD_COUNT=$(python3 -c "
          import actenon_scan.detectors.go as go
          import inspect
          src = inspect.getsource(go)
          print(src.lower().count('guard'))
          " 2>/dev/null || echo "0")

          echo "Go guard mentions: $GUARD_COUNT"

          if [ "$GUARD_COUNT" -lt 100 ]; then
            echo "FAIL: Go guard recognition not present (only $GUARD_COUNT mentions)." >&2
            exit 1
          fi
          echo "OK: Go guard recognition present ($GUARD_COUNT mentions)"

  advance-v1:
    name: Move v1 tag to latest release
    needs: release-gate
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move v1 tag
        run: |
          # Get the release tag: from the release event, or from workflow_dispatch input
          RELEASE_TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Release tag: $RELEASE_TAG"

          # Only advance v1 if this is a v1.x.x release
          if [[ "$RELEASE_TAG" =~ ^v1\. ]]; then
            echo "Release gate passed — advancing v1 tag to $RELEASE_TAG"

            # Work Order 1.5: resolve the release tag to its commit, then
            # create the v1 tag object pointing at that commit with the
            # tag field reading "v1" (not the release tag name).
            COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")
            echo "Release tag $RELEASE_TAG resolves to commit $COMMIT"

            # Delete the old v1 tag (locally and remotely) then create a
            # new annotated tag whose `tag` field reads "v1".
            git tag -d v1 2>/dev/null || true
            git push origin :refs/tags/v1 2>/dev/null || true
            git tag -a v1 -m "Move v1 to $RELEASE_TAG (release gate passed)" "$COMMIT"
            git push origin v1

            echo "v1 now points at $RELEASE_TAG (commit $COMMIT)"
            echo "Tag object contents:"
            git cat-file -p v1
          else
            echo "Not a v1.x.x release ($RELEASE_TAG) — skipping v1 tag advance"
          fi
