name: Verify claims

# Machine-enforce every claim the README makes about the package itself.
# Moved out of ci.yml so the README badge can link to a dedicated gate.
# The daily schedule matters: the registry-install check depends on live
# PyPI state, which can change with no PR to catch it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch:

jobs:
  verify-claims:
    # Machine-enforce every claim the README makes about the package itself.
    # Fable 5 Part 3A/G: scan's "Zero runtime dependencies" badge is its
    # single most important credibility claim (it's what lets DevSecOps
    # deploy scan unilaterally). Make it machine-verified, not editorial.
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify zero runtime dependencies
        # The README's "Dependencies: 0" badge is the single most important
        # credibility claim for scan. Enforce it.
        run: |
          python - <<'EOF'
          import tomllib, sys
          with open('pyproject.toml','rb') as f:
              data = tomllib.load(f)
          deps = data['project'].get('dependencies', [])
          if deps:
              print(f'FAIL: actenon-scan must have zero runtime deps, found: {deps}', file=sys.stderr)
              sys.exit(1)
          print('OK: zero runtime dependencies')
          EOF

      - name: Check generated Python badge
        run: python scripts/sync_badges.py --check

      - name: Check README registry installs
        run: python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-scan

