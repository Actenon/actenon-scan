name: Verify claims

# Machine-enforce every claim the README makes about the package itself.
# Moved out of ci.yml so the README badge can link to a dedicated gate.
# The daily schedule matters: the registry-install check depends on live
# PyPI state, which can change with no PR to catch it.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "59 6 * * *"
  workflow_dispatch:

jobs:
  verify-claims:
    # Machine-enforce every claim the README makes about the package itself.
    # Fable 5 Part 3A/G: scan's "Zero runtime dependencies" badge is its
    # single most important credibility claim (it's what lets DevSecOps
    # deploy scan unilaterally). Make it machine-verified, not editorial.
    name: Verify README claims (machine-enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify zero runtime dependencies
        # The README's "Dependencies: 0" badge is the single most important
        # credibility claim for scan. Enforce it.
        run: |
          python - <<'EOF'
          import tomllib, sys
          with open('pyproject.toml','rb') as f:
              data = tomllib.load(f)
          deps = data['project'].get('dependencies', [])
          if deps:
              print(f'FAIL: actenon-scan must have zero runtime deps, found: {deps}', file=sys.stderr)
              sys.exit(1)
          print('OK: zero runtime dependencies')
          EOF

      - name: Check generated Python badge
        run: python scripts/sync_badges.py --check

      - name: Check README registry installs
        run: python scripts/check_readme_installs.py

      - name: Check README ecosystem table in sync with ecosystem.yaml
        run: |
          pip install "actenon-protocol[yaml]" --quiet
          python -m actenon_protocol.ecosystem --check README.md --repo actenon-scan

      - name: Self-scan reports clean on own repository
        # Work Order 3, Part 1.3: the tool must report zero findings on its
        # own repository. Test fixtures are excluded via .actenon-scan.json.
        # If this check fails, either a real finding was introduced in
        # production code, or the exclusion config was removed/broken.
        run: |
          pip install -e ".[typescript,go,yaml]" --quiet
          OUTPUT=$(actenon-scan scan . --fail-on none 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Your agent can reach"; then
            echo "FAIL: actenon-scan reports findings on its own repository." >&2
            echo "Either fix the production code or add the path to .actenon-scan.json excludes." >&2
            exit 1
          fi
          echo "OK: self-scan reports clean"

      - name: v1 tag points at newest stable release
        # ITEM 6: the v1 floating tag must track the newest v1.x.y release.
        # The release-v1-tag workflow automates this, but if it's bypassed
        # (manual release, workflow disabled), the drift must be visible.
        run: |
          # Fetch tags (the default checkout doesn't include them)
          git fetch --tags origin

          # Get the newest v1.x.y tag (excluding v1 itself and pre-release tags)
          NEWEST=$(git tag -l 'v1.*' | grep -v '^v1$' | grep -v 'integration' | sort -V | tail -1)
          V1_COMMIT=$(git rev-parse "v1^{commit}" 2>/dev/null || echo "")
          NEWEST_COMMIT=$(git rev-parse "${NEWEST}^{commit}" 2>/dev/null || echo "")

          echo "Newest stable tag: $NEWEST ($NEWEST_COMMIT)"
          echo "v1 tag: ($V1_COMMIT)"

          if [ -z "$V1_COMMIT" ] || [ -z "$NEWEST_COMMIT" ]; then
            echo "FAIL: could not resolve v1 or newest tag" >&2
            exit 1
          fi

          if [ "$V1_COMMIT" != "$NEWEST_COMMIT" ]; then
            echo "FAIL: v1 tag ($V1_COMMIT) does not match newest stable release $NEWEST ($NEWEST_COMMIT)" >&2
            echo "Run: git tag -f v1 $NEWEST && git push origin v1 --force" >&2
            exit 1
          fi
          echo "OK: v1 points at $NEWEST"

      - name: Action pyproject.toml version matches PyPI
        # ITEM 6: the version in pyproject.toml at the v1 tag must equal
        # the newest published PyPI version. If they diverge, users
        # following the documented setup get a stale version.
        run: |
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          PYPI_VERSION=$(curl -s https://pypi.org/pypi/actenon-scan/json | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['version'])")

          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "PyPI latest: $PYPI_VERSION"

          if [ "$PYPROJECT_VERSION" != "$PYPI_VERSION" ]; then
            echo "FAIL: pyproject.toml version ($PYPROJECT_VERSION) != PyPI version ($PYPI_VERSION)" >&2
            exit 1
          fi
          echo "OK: versions match"

      - name: CORPUS_STUDY.md is current
        # Work Order 3, Part 5.3: the corpus study must not drift from the
        # triage data. This check fails if the document is stale.
        run: python scripts/generate_corpus_study.py --check

      - name: SOUNDNESS_CHALLENGE.md is current
        # The scoreboard must not drift from the challenge fixture metadata.
        run: python scripts/generate_soundness_scoreboard.py --check

