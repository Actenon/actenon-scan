name: Version drift gate

# Fable 5 / WO-19: "Add a CI job that FAILS if pyproject.toml's version is
# ahead of the newest git tag on main. This defect class must not recur, in
# any repo."
#
# This workflow runs on every push to main and on every PR. It checks that
# the version declared in pyproject.toml has a corresponding git tag. If
# pyproject.toml says 0.2.3 but the newest tag is v0.2.2, the gate fails.
#
# This prevents the exact defect that WO-19 addresses: a fixed version
# sitting in the repo while the published (tagged) version crashes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  version-drift:
    name: Verify pyproject version has a git tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check pyproject version is tagged
        run: |
          set -euo pipefail
          # Extract version from pyproject.toml
          PYPROJECT_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              d = tomllib.load(f)
          print(d['project']['version'])
          ")
          echo "pyproject.toml version: $PYPROJECT_VERSION"

          # Get the newest tag (by version sort, not date)
          NEWEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]' | sed 's/^v//' | sort -V | tail -1)
          echo "newest git tag: v${NEWEST_TAG:-<none>}"

          # Check if a tag exists for the pyproject version
          if git rev-parse "v${PYPROJECT_VERSION}" >/dev/null 2>&1; then
            echo "OK: tag v${PYPROJECT_VERSION} exists for pyproject version ${PYPROJECT_VERSION}"
            exit 0
          fi

          # No tag for the current pyproject version — this is the drift.
          # Fails CI so the defect class cannot recur.
          echo "::error::pyproject.toml declares version ${PYPROJECT_VERSION} but no git tag v${PYPROJECT_VERSION} exists."
          echo "::error::The newest tag is v${NEWEST_TAG:-<none>}."
          echo "::error::Either tag v${PYPROJECT_VERSION} (if this version is ready to publish)"
          echo "::error::or revert pyproject.toml to ${NEWEST_TAG} (if this version is not yet ready)."
          exit 1
