[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "actenon-scan"
version = "1.1.4"
description = "Defensive static-analysis scanner for the AI-agent execution gap."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Actenon" }]
keywords = ["security", "static-analysis", "ai-agents", "execution-gap", "sast"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Actenon/actenon-scan"
Documentation = "https://github.com/Actenon/actenon-scan/blob/main/README.md"
Source = "https://github.com/Actenon/actenon-scan"
Issues = "https://github.com/Actenon/actenon-scan/issues"
Changelog = "https://github.com/Actenon/actenon-scan/blob/main/CHANGELOG.md"
Security = "https://github.com/Actenon/actenon-scan/blob/main/SECURITY.md"

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
typescript = [
  "tree-sitter>=0.25,<1",
  "tree-sitter-typescript>=0.23,<1",
]
go = [
  "tree-sitter>=0.25,<1",
  "tree-sitter-go>=0.25,<1",
]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "tree-sitter>=0.25,<1",
  "tree-sitter-typescript>=0.23,<1",
  "tree-sitter-go>=0.25,<1",
  # tomllib is stdlib in Python 3.11+. On 3.10, use tomli as a backport.
  "tomli>=2.0; python_version < '3.11'",
  # actenon-protocol is a DEV-only dependency. Scan is a static analyzer
  # with ZERO runtime dependencies (it must remain installable without
  # pulling in the protocol package). The protocol is used only by the
  # drift gate (tests/test_protocol_drift.py) to verify that scan's
  # guard vocabulary and refusal-code references stay in sync with the
  # protocol's catalogue.
  "actenon-protocol[types]>=1.1.0,<2",
]

[project.scripts]
actenon-scan = "actenon_scan.cli:main"

[tool.setuptools]
packages = [
    "actenon_scan",
    "actenon_scan.detectors",
    "actenon_scan.report",
    "actenon_scan.rules",
]

[tool.setuptools.package-data]
"actenon_scan.rules" = ["default_rules.json"]
# py.typed marker declares the package as PEP 561 typed. Integrators using
# mypy/pyright get type information from actenon_scan.api and the dataclasses
# in actenon_scan.engine.
"actenon_scan" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
