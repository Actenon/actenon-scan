# Challenge case metadata.
# This file is read by the scoreboard generator and the test runner.

issue: 0  # 0 = filed by maintainers from an external review, not a GitHub issue
submitter: actenon
found_by: external review
class: missed-sink
language: python
title: "Sink one hop from an entry point is missed, and the scan reports clean"
description: >
  A @tool-decorated entry point calls a module-level helper in the same file,
  and the helper performs the consequential action. Analysis is per-function:
  reachability is decided by the function ENCLOSING the sink, so the helper
  is not agent-reachable and the sink is not reported. The scan printed
  "No supported unguarded consequential-action paths were identified" with
  nothing to indicate a call had been stepped over.

  CHALLENGE-003.control.py holds the identical sink written inline in the
  tool body. It is reported as MEDIUM NET-EGRESS. The single function call
  is the entire difference between a finding and silence.
expected: finding
rule_id: NET-EGRESS
control_file: CHALLENGE-003.control.py
control_rule_id: NET-EGRESS
status: fixed
fixed_in: 1.5.0
note: >
  Fixed in two steps, and the order matters.

  First the silence was disclosed: every scan reports how many calls from
  agent-reachable code into locally-defined functions it did not follow, and
  reports analysis coverage as a count pair. That alone did not find this
  sink — disclosure is not detection — and the case stayed open.

  Then depth-1 same-module following landed. The sink is now reported as
  NET-EGRESS at MEDIUM reachability confidence with the signal
  one_hop_local, downgrading the severity to LOW. The control is still
  reported at HIGH confidence: a sink in the tool body remains stronger
  evidence than a sink one hop away, and the two are not conflated.

  The same change moved this file's call edge out of the unfollowed count
  and into analysis coverage (0 followed / 1 not followed, to 1 followed /
  0 not followed). Depth >= 2 and cross-file calls remain unfollowed and
  disclosed.
