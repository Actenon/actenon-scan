issue: 0  # 0 = filed by maintainers from an external review, not a GitHub issue
submitter: actenon
found_by: external review
class: false-positive
language: python
title: "Parameterised INSERT in a plain Flask view reported HIGH DATABASE-MUTATE"
description: >
  Reduced from pallets/flask examples/tutorial/flaskr/auth.py:66. flask is
  pinned in tests/benchmark/pinned_repos.json with category "control", and
  corpus-triage.json states that any finding in a control repo is a precision
  failure by definition.

  No agent framework is imported anywhere in the source repository. The SQL
  is parameterised. The view is reported only because
  reachability.resource_boundary_decorators contains the BARE names "get",
  "post", "put", "delete", "patch", "route" and "api_route" and is on by
  default, so @bp.route matches and the handler is treated as a
  HIGH-confidence entry point.

  Separately: tests/benchmark/corpus-results.json records 0 findings for
  flask at its pinned SHA. Re-running the current scanner at that same SHA
  produces this finding, so the recorded corpus evidence predates the
  resource-boundary feature and was never re-measured.
expected: clean
status: fixed
fixed_in: 1.5.0
note: >
  Fixed. The bare decorator names were removed, leaving only qualified forms
  (app.route, bp.post, router.api_route, ...), and the resource-boundary
  signal is now opt-in behind --resource-boundary or the config key
  reachability.resource_boundary_enabled.

  pallets/flask at HEAD and at its pinned SHA both report zero findings at
  defaults. With --resource-boundary this finding returns, by design: at
  that point the user has asked for web route handlers to count as entry
  points, and the finding is the answer to the question they asked.

  tests/benchmark/precision/p20_flask_route_no_agent.py is the permanent
  regression fixture, asserted silent at defaults and reporting with the
  flag.
